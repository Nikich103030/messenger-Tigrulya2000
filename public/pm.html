<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html lang="ru">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Tigrulya2000 — Личные сообщения</title>
  <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body onload="initPmPage();">

<div class="page-wrap">

  <div class="header-box">
    <h1>★ Tigrulya2000 ★</h1>
    <div class="subtitle" id="pm-title">Личные сообщения</div>
  </div>

  <div class="nav-bar">
    <a href="chat.html">Чат <span id="nav-pm-badge" class="nav-badge" style="display:none;"></span></a> |
    <a href="friends.html">Друзья <span id="nav-requests-badge" class="nav-badge" style="display:none;"></span></a> |
    <a href="profile.html">Профиль</a> |
    <a href="settings.html">Оформление</a> |
    <a href="#" onclick="doLogout(); return false;">Выход</a>
  </div>

  <div class="content-box">

    <div class="win-panel">
      <div class="win-title">Личная переписка <span id="pm-subtitle"></span></div>

      <div id="pm-log" class="chat-log pm-log">
        <div class="chat-line"><span class="chat-text">*** Загрузка...</span></div>
      </div>

      <div id="pm-error" class="error-msg" style="display:none;"></div>

      <form id="pm-form" action="#" method="post">
        <table class="chat-form-table" cellpadding="0" cellspacing="0">
          <tr>
            <td class="chat-input-cell">
              <input type="text" id="pm-input" class="text-field chat-input-field" maxlength="500" autocomplete="off">
            </td>
            <td class="chat-submit-cell">
              <input type="submit" value=" Отправить " class="btn">
            </td>
          </tr>
        </table>
      </form>

      <p style="margin-top:8px;"><a href="friends.html">← Назад к друзьям</a></p>
    </div>

  </div>

  <div class="footer-box">
    © 2000-2026 Tigrulya2000
  </div>

</div>

<script type="text/javascript" src="js/common.js"></script>
<script type="text/javascript" src="js/theme.js"></script>
<script type="text/javascript" src="js/pm.js"></script>
</body>
</html>
